      if (area) { area.focus(); area.select(); }
    }

    function tarjeta(p, i) {
      const cuotas = p.cuotas && Number(p.cuotas.n) > 1 && Number(p.cuotas.monto) > 0
        ? '<div class="cat-cuotas">o ' + Number(p.cuotas.n) + ' cuotas de ' + esc(GS.money(p.cuotas.monto)) + '</div>' : '';
      const botonEnvio = puedeCotizar
        ? '<button type="button" class="cat-env" data-env="' + esc(p._clave) + '" aria-pressed="' + (seleccion.has(p._clave) ? 'true' : 'false') + '" aria-label="Calcular envío de ' + esc(p._nombre) + '" title="Calcular envío">' + ICONO.camion + '</button>'
        : '';
      const consulta = botonConsulta(textoProducto(p), 'Pedir');
      const src = p.imagen
        ? atributosFoto(p.imagen, anchoFoto)
        : 'src="' + esc(GS.tarjetaMarca(p.marca || p._nombre)) + '"';
      const idNotas = 'catNotas' + esc(p._clave);
      const notas = p._notas
        ? '<div class="cat-notas" id="' + idNotas + '" data-notas="' + esc(p._clave) + '"></div>' +
          '<button type="button" class="cat-notas-btn" data-ver-notas="' + esc(p._clave) + '" aria-expanded="false" aria-controls="' + idNotas + '" aria-label="Ver notas de ' + esc(p._nombre) + '">' + ICONO.gota + '<span>Notas</span></button>'
        : '';
      return '<article class="cat-card' + (p._notas ? ' gsn-anfitrion' : '') + '">' +
        '<div class="cat-foto ' + (!p.imagen || GS.fotoLlena(p.imagen) ? 'cat-foto-llena' : 'cat-foto-blanca') + '">' +
          '<img ' + src + ' alt="' + esc(p._nombre) + '" loading="' + (i < 4 ? 'eager' : 'lazy') + '" decoding="async" width="600" height="600" data-marca="' + esc(p.marca || p._nombre) + '"' + (p.imagen ? '' : ' data-generada="1"') + '>' +
        '</div>' + notas +
        '<div class="cat-info">' +
          (p.marca ? '<div class="cat-marca">' + esc(p.marca) + '</div>' : '') +
          '<h3 class="cat-nombre">' + esc(p._corto) + '</h3>' +
          (p._specs ? '<div class="cat-specs">' + esc(p._specs) + '</div>' : '') +
          (tienePrecio(p)
            ? '<div class="cat-precio">' + esc(GS.money(p.precio)) + '</div>' + cuotas
            : '<div class="cat-precio cat-consultar">Consultá el precio</div>') +
          ((consulta || botonEnvio) ? '<div class="cat-acciones">' + consulta + botonEnvio + '</div>' : '') +
        '</div></article>';
    }

    function fotoSeccion(clave) {
      return fotosSec[clave] || '';
    }

    // Cada foto se pide del ancho que necesita para cubrir su tarjeta (con la tarjeta más alta que la foto, manda el alto).
    function htmlSecciones() {
      if (secciones.length < 2) return '';
      const spans = columnasSecciones(secciones.length);
      return '<section class="cat-bloque" aria-labelledby="catTitSecs"><div class="cat-bloque-cab cat-revela"><div><p class="cat-ceja">Explorá</p><h2 class="cat-tit" id="catTitSecs">Nuestras secciones</h2></div></div>' +
        '<div class="cat-secs">' + secciones.map(function (s, i) {
          const url = fotoSeccion(s.clave);
          const caja = cajaSeccion(spans, i);
          return '<button type="button" class="cat-sec' + (url ? '' : ' cat-sec-sinfoto') + '" data-sec="' + esc(s.clave) + '" aria-pressed="false" style="--i:' + i + ';--span:' + spans[i] + (s.prop <= 1.1 ? ';--pos:' + ENCUADRE_CUADRADA : '') + '">' +
            (url ? '<img ' + atributosCubrir(url, GS.anchoParaCubrir(caja.ancho, caja.alto, s.prop)) + ' alt="" loading="lazy" decoding="async">' : '') +
            '<span class="cat-sec-ir" aria-hidden="true">' + ICONO.ir + ICONO.ok + '</span>' +
            '<span class="cat-sec-txt"><b>' + esc(s.nombre) + '</b><small>' + (s.n === 1 ? '1 producto' : s.n + ' productos') + '</small></span></button>';
        }).join('') + '</div></section>';
    }

    function htmlMarcas() {
      if (marcas.length < 2) return '';
      return '<section class="cat-bloque" aria-labelledby="catTitMarcas"><div class="cat-bloque-cab cat-revela"><div><p class="cat-ceja">Marcas</p><h2 class="cat-tit" id="catTitMarcas">Elegí tu marca</h2></div></div>' +
        '<div class="cat-marcas-caja cat-revela">' +
          '<button type="button" class="cat-flecha cat-flecha-izq" data-flecha="-1" aria-label="Ver marcas anteriores" disabled>' + ICONO.izq + '</button>' +
          '<div class="cat-marcas" role="group" aria-label="Filtrar por marca">' + marcas.map(function (m) {
            return '<button type="button" class="cat-marca-b" data-marca-b="' + esc(m.nombre) + '" aria-pressed="false">' +
              '<span class="cat-marca-logo">' + (m.logo
                ? '<img ' + atributosFoto(m.logo, 160) + ' alt="" loading="lazy" decoding="async">'
                : '<span class="cat-marca-txt">' + esc(m.nombre) + '</span>') + '</span>' +
              '<span class="cat-marca-pie"><span>' + esc(m.nombre) + '</span><i class="cat-marca-n">' + m.n + '</i></span></button>';
          }).join('') + '</div>' +
          '<button type="button" class="cat-flecha cat-flecha-der" data-flecha="1" aria-label="Ver más marcas">' + ICONO.der + '</button>' +
        '</div></section>';
    }

    function htmlGeneros() {
      if (generos.length < 2) return '';
      const caja = cajaGenero(generos.length);
      // Las fotos de los géneros son cuadradas.
      const ancho = GS.anchoParaCubrir(caja.ancho, caja.alto, 1);
      return '<section class="cat-bloque" aria-labelledby="catTitGen"><div class="cat-bloque-cab cat-revela"><div><p class="cat-ceja">Género</p><h2 class="cat-tit" id="catTitGen">Para cada estilo</h2></div></div>' +
        '<div class="cat-gens cat-revela" role="group" aria-label="Filtrar por género" style="--n:' + generos.length + '">' + generos.map(function (g) {
          const url = fotoSeccion(claveSeccion(g.nombre));
          return '<button type="button" class="cat-gen' + (url ? '' : ' cat-gen-sinfoto') + '" data-gen="' + esc(g.nombre) + '" aria-pressed="false">' +
            (url ? '<img ' + atributosCubrir(url, ancho) + ' alt="" loading="lazy" decoding="async">' : '') +
            '<b>' + esc(capital(g.nombre)) + '</b><small class="cat-gen-n">' + g.n + '</small></button>';
        }).join('') + '</div></section>';
    }

    /**
     * Tres fotos reales del catálogo en el encabezado (una por sección, en el orden de las secciones), de las de fondo
     * plateado si hay tres. Se cargan enseguida (no lazy): son lo primero que se ve.
     */
    function htmlVitrinaHero() {
      const conFoto = productos.filter(function (p) { return !!p.imagen; });
      const llenas = conFoto.filter(function (p) { return GS.fotoLlena(p.imagen); });
      const fuente = llenas.length >= 3 ? llenas : conFoto;
      const elegidos = [];
      secciones.forEach(function (s) {
        if (elegidos.length >= 3) return;
        const p = fuente.find(function (x) { return x._sec === s.clave; });
        if (p) elegidos.push(p);
      });
      fuente.forEach(function (p) {
        if (elegidos.length < 3 && elegidos.indexOf(p) < 0) elegidos.push(p);
      });
      if (elegidos.length < 3) return '';
      // El orden visual pone la del medio adelante: la primera elegida va al centro.
      return '<div class="cat-hero-vit" aria-hidden="true"><span class="cat-aro"></span>' + [elegidos[1], elegidos[0], elegidos[2]].map(function (p, i) {
        return '<figure class="cat-hv cat-hv-' + i + (GS.fotoLlena(p.imagen) ? '' : ' cat-hv-blanca') + '" style="--i:' + i + '">' +
          '<img ' + atributosFoto(p.imagen, i === 1 ? 230 : 180) + ' alt="" loading="eager" fetchpriority="high" decoding="async" width="230" height="230" data-marca="' + esc(p.marca || p._nombre) + '"></figure>';
      }).join('') + '</div>';
    }

    function htmlDatosHero() {
      const datosHero = [];
      if (marcas.length > 1) datosHero.push(ICONO.estrella + marcas.length + ' marcas');
      if (maxCuotas > 1) datosHero.push(ICONO.tarjeta + 'Hasta ' + maxCuotas + ' cuotas');
      if (puedeCotizar) datosHero.push(ICONO.camion + 'Envíos a todo el país');
      return datosHero.length ? '<ul class="cat-hero-datos">' + datosHero.map(function (d) { return '<li>' + d + '</li>'; }).join('') + '</ul>' : '';
    }

    const subtitulo = productos.length === 1 ? '1 producto disponible' : productos.length + ' productos disponibles';
    const logoHtml = marca.logo
      ? '<img class="cat-logo" src="' + esc(srcLogo(marca.logo)) + '" alt="' + esc(nombreMarca) + '">'
      : '<div class="cat-mono" aria-hidden="true">' + esc(iniciales(nombreMarca)) + '</div>';
    const miniHtml = marca.logo
      ? '<img class="cat-mini-logo" src="' + esc(srcLogo(marca.logo)) + '" alt="">'
      : '<span class="cat-mini-mono" aria-hidden="true">' + esc(iniciales(nombreMarca)) + '</span>';
    const vitrina = productos.length ? htmlSecciones() + htmlMarcas() + htmlGeneros() : '';
    const redes = (numeroWa ? '<a class="cat-red" href="' + esc(GS.wa(numeroWa, 'Hola! Vi tu catálogo y te quería hacer una consulta.')) + '" target="_blank" rel="noopener">' + ICONO.wa + 'WhatsApp</a>' : '') +
      (linkIg ? '<a class="cat-red' + (numeroWa ? ' cat-red-sec' : '') + '" href="' + esc(linkIg) + '" target="_blank" rel="noopener">' + ICONO.ig + 'Instagram</a>' : '');
    const vitrinaHero = productos.length ? htmlVitrinaHero() : '';
    const pieHero = htmlDatosHero() + (redes ? '<div class="cat-redes">' + redes + '</div>' : '');

    contenedor.innerHTML =
      '<div class="cat' + (puedeCotizar ? ' cat-con-envio' : '') + (mov ? ' cat-mov' : '') + (io ? ' cat-io' : '') + '"' +
        (placa ? ' style="--placa:' + esc(placa.fondo) + ';--placa-tinta:' + esc(placa.primario) + '"' : '') + '>' +
        '<header class="cat-hero"><div class="cat-hero-in">' +
          logoHtml +
          '<div class="cat-hero-txt"><p class="cat-hero-ceja">Catálogo</p><h1>' + tituloPartido(nombreMarca) + '</h1>' +
            '<p class="cat-hero-sub">' + esc(productos.length ? subtitulo : 'Catálogo') + '</p></div>' +
          (pieHero ? '<div class="cat-hero-pie">' + pieHero + '</div>' : '') +
          vitrinaHero +
        '</div></header>' +
        (productos.length ? (
          '<div class="cat-barra"><div class="cat-barra-in"><span class="cat-mini" aria-hidden="true">' + miniHtml + '<b>' + esc(nombreMarca) + '</b></span>' +
            '<label class="cat-busca">' + ICONO.lupa +
            '<span class="cat-oculto">Buscar</span><input type="search" class="cat-q" placeholder="Buscá por perfume o marca" autocomplete="off" enterkeyhint="search">' +
            '<button type="button" class="cat-busca-x" aria-label="Borrar búsqueda" hidden>' + ICONO.cerrar + '</button>' +
          '</label></div><span class="cat-progreso" aria-hidden="true"></span></div>' +
          (vitrina ? '<div class="cat-vitrina">' + vitrina + '</div>' : '') +
          (puedeCotizar ? '<div class="cat-envio cat-revela"><div class="cat-envio-in"><div class="cat-envio-ico">' + ICONO.camion + '</div>' +
            '<div class="cat-envio-txt"><b>Envíos a todo el país</b><span>Por Correo Argentino: <em>Clásico</em>, el más económico (' + SERVICIO_INFO.CLASICO.plazo + '), o <em>Expreso</em>, el más rápido (' + SERVICIO_INFO.EXPRESO.plazo + '). Plazos estimados.</span></div>' +
            '<button type="button" class="cat-boton cat-abrir-envio">Calcular envío</button></div></div>' : '') +
          '<section class="cat-listado" aria-labelledby="catTitListado">' +
          '<div class="cat-controles">' +
            '<div><p class="cat-ceja">Catálogo</p><h2 class="cat-tit" id="catTitListado">Todos los productos</h2></div>' +
            (secciones.length > 1 ? '<div class="cat-chips" role="group" aria-label="Secciones"></div>' : '') +
            '<div class="cat-filtros">' +
              (marcas.length > 1 ? '<label class="cat-sel"><span class="cat-oculto">Marca</span><select class="cat-f-marca"></select></label>' : '') +
              (generos.length > 1 ? '<label class="cat-sel"><span class="cat-oculto">Género</span><select class="cat-f-genero"></select></label>' : '') +
              (productos.length > 1 ? '<label class="cat-sel"><span class="cat-oculto">Ordenar</span><select class="cat-f-orden">' +
                ORDENES.map(function (o) { return '<option value="' + o[0] + '">' + esc(o[1]) + '</option>'; }).join('') +
              '</select></label>' : '') +
            '</div>' +
            '<div class="cat-cuenta" aria-live="polite"></div>' +
          '</div>' +
          '<div class="cat-grilla"></div>' +
          '<div class="cat-sin-res" hidden></div>' +
          '</section>'
        ) : bloqueVacio(ICONO.frasco, 'Estamos renovando el catálogo',
              hayContacto ? 'En este momento no hay productos para mostrar. Escribinos y te contamos qué hay disponible.'
                : 'En este momento no hay productos para mostrar. Volvé a pasar en unos días.',
              botonConsulta('Hola! Quería saber qué productos tenés disponibles.', numeroWa ? 'Escribinos' : 'Consultanos', ''))) +
        (datos.textoAPedido && hayContacto ? '<section class="cat-apedido cat-revela"><div class="cat-apedido-in"><div class="cat-apedido-txt"><h2>¿Buscás algo que no está?</h2><p>' + esc(datos.textoAPedido) + '</p></div>' +
          (numeroWa ? '<a class="cat-red" href="' + esc(GS.wa(numeroWa, 'Hola! Quería consultar por un producto a pedido.')) + '" target="_blank" rel="noopener">' + ICONO.wa + 'Pedilo por WhatsApp</a>'
            : (linkIg ? '<a class="cat-red" href="' + esc(linkIg) + '" target="_blank" rel="noopener" data-ig-pedido="' + esc('Hola! Quería consultar por un producto a pedido.') + '">' + ICONO.ig + 'Consultanos</a>' : '')) +
          '</div></section>' : '') +
        '<footer class="cat-pie"><span>' + esc(nombreMarca) + '</span>' +
          (linkIg ? '<a href="' + esc(linkIg) + '" target="_blank" rel="noopener">Instagram</a>' : '') +
          (numeroWa ? '<a href="' + esc(GS.wa(numeroWa, 'Hola! Vi tu catálogo y te quería hacer una consulta.')) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
          (productos.length ? '<button type="button" data-arriba>' + ICONO.arriba + 'Volver arriba</button>' : '') +
        '</footer>' +
        (puedeCotizar ? htmlHoja(envio) : '') +
      '</div>';

    const raiz = contenedor.firstChild;
    const $ = function (sel) { return raiz.querySelector(sel); };
    const grilla = $('.cat-grilla');
    const observadores = [];
    instancia = {
      cerrarHoja: null,
      atraparTab: null,
      cerrarNotas: null,
      progreso: productos.length ? $('.cat-progreso') : null,
      limpiar: function () { observadores.forEach(function (o) { o.disconnect(); }); }
    };
    instalarGlobales();

    // Un logo blanco transparente sobre el fondo claro de su caja (o negro sobre uno oscuro) no se ve: va sobre una placa
    // que contraste.
    if (marca.logo) {
      const logoEl = $('.cat-logo');
      const miniEl = $('.cat-mini-logo');
      GS.tema.placaLogo(srcLogo(marca.logo), placa ? placa.fondo : oscuro.fondo).then(function (color) {
        if (color && logoEl) logoEl.style.background = color;
        if (color && miniEl) miniEl.style.background = color;
      });
    }

    // Bloques que aparecen al entrar en pantalla.
    if (io) {
      const revela = new IntersectionObserver(function (entradas) {
        entradas.forEach(function (e) {
          if (!e.isIntersecting) return;
          e.target.classList.add('cat-visto');
          revela.unobserve(e.target);
        });
      }, { rootMargin: '0px 0px -8% 0px' });
      observadores.push(revela);
      raiz.querySelectorAll('.cat-revela, .cat-secs').forEach(function (el) { revela.observe(el); });
    }

    if (!productos.length) return;

    const cuenta = $('.cat-cuenta');
    const sinRes = $('.cat-sin-res');
    const inputQ = $('.cat-q');
    const botonX = $('.cat-busca-x');
    const chips = $('.cat-chips');
    const selMarca = $('.cat-f-marca');
    const selGenero = $('.cat-f-genero');
    const selOrden = $('.cat-f-orden');
    const tituloListado = $('#catTitListado');
    const barra = $('.cat-barra');
    const pistaMarcas = $('.cat-marcas');
    let notasAbierta = null;

    if (chips) {
      chips.innerHTML = [{ clave: '', nombre: 'Todo', n: productos.length }].concat(secciones).map(function (s) {
        return '<button type="button" class="cat-chip" data-sec="' + esc(s.clave) + '" aria-pressed="' + (estado.sec === s.clave ? 'true' : 'false') + '">' +
          esc(s.nombre) + '<i>' + s.n + '</i></button>';
      }).join('');
    }
    if (selOrden) selOrden.value = estado.orden;

    // La barra de búsqueda se "pega" arriba con la marca chica cuando el encabezado sale de pantalla.
    if (typeof window.IntersectionObserver === 'function' && barra) {
      const pegada = new IntersectionObserver(function (entradas) {
        const e = entradas[0];
        barra.classList.toggle('cat-pegada', !e.isIntersecting && e.boundingClientRect.top < 0);
      });
      observadores.push(pegada);
      pegada.observe($('.cat-hero'));
    }

    // Tarjetas: entran escalonadas a medida que aparecen (también después de filtrar).
    let entrada = null;
    if (io) {
      entrada = new IntersectionObserver(function (entradas) {
        let k = 0;
        entradas.forEach(function (e) {
          if (!e.isIntersecting) return;
          e.target.style.setProperty('--k', String(Math.min(k++, 9)));
          e.target.classList.add('cat-entro');
          entrada.unobserve(e.target);
        });
      }, { rootMargin: '0px 0px -4% 0px' });
      observadores.push(entrada);
    }

    function pasa(p, sin) {
      return (sin === 'sec' || !estado.sec || p._sec === estado.sec) &&
        (sin === 'marca' || !estado.marca || p.marca === estado.marca) &&
        (sin === 'genero' || !estado.genero || p.genero === estado.genero);
    }

    function cuentaPor(campo, sin) {
      const n = {};
      productos.forEach(function (p) {
        const v = p[campo];
        if (v && pasa(p, sin)) n[v] = (n[v] || 0) + 1;
      });
      return n;
    }

    function filtrados() {
      const terminos = norm(estado.q).split(/\s+/).filter(Boolean);
      const lista = productos.filter(function (p) {
        return pasa(p, '') && terminos.every(function (t) { return p._busca.indexOf(t) !== -1; });
      });
      const precio = function (p) { return tienePrecio(p) ? Number(p.precio) : Infinity; };
      if (estado.orden === 'precio-asc') lista.sort(function (a, b) { return precio(a) - precio(b) || a._orden - b._orden; });
      else if (estado.orden === 'precio-desc') lista.sort(function (a, b) { return (tienePrecio(b) ? Number(b.precio) : -1) - (tienePrecio(a) ? Number(a.precio) : -1) || a._orden - b._orden; });
      else if (estado.orden === 'nombre') lista.sort(function (a, b) { return comparar(a._corto, b._corto) || a._orden - b._orden; });
      else if (estado.orden === 'destacados') lista.sort(function (a, b) { return a._orden - b._orden; });
      else {
        // Marca (A–Z) y, dentro de cada marca, el nombre; lo que no tiene marca va al final.
        lista.sort(function (a, b) {
          return (a.marca ? 0 : 1) - (b.marca ? 0 : 1) || comparar(a.marca, b.marca) || comparar(a._corto, b._corto) || a._orden - b._orden;
        });
      }
      return lista;
    }

    function hayFiltros() { return !!(estado.q.trim() || estado.sec || estado.marca || estado.genero); }

    function nombreSeccion(clave) {
      const s = secciones.find(function (x) { return x.clave === clave; });
      return s ? s.nombre : clave;
    }

    // Cada filtro muestra sólo lo que tiene productos con los otros filtros puestos.
    function pintarFacetas() {
      raiz.querySelectorAll('[data-sec]').forEach(function (b) {
        const activo = b.getAttribute('data-sec') === estado.sec;
        b.setAttribute('aria-pressed', activo ? 'true' : 'false');
        if (activo && chips && b.parentNode === chips) centrarChip(b);
      });
      const nMarca = cuentaPor('marca', 'marca');
      raiz.querySelectorAll('[data-marca-b]').forEach(function (b) {
        const m = b.getAttribute('data-marca-b');
        const n = nMarca[m] || 0;
        b.hidden = !n && m !== estado.marca;
        b.setAttribute('aria-pressed', m === estado.marca ? 'true' : 'false');
        const c = b.querySelector('.cat-marca-n');
        if (c) c.textContent = String(n);
      });
      const nGenero = cuentaPor('genero', 'genero');
      raiz.querySelectorAll('[data-gen]').forEach(function (b) {
        const g = b.getAttribute('data-gen');
        const n = nGenero[g] || 0;
        b.disabled = !n && g !== estado.genero;
        b.setAttribute('aria-pressed', g === estado.genero ? 'true' : 'false');
        const c = b.querySelector('.cat-gen-n');
        if (c) c.textContent = String(n);
      });
      if (selMarca) {
        selMarca.innerHTML = opcionesSelect(nombresMarcas.filter(function (m) { return nMarca[m] || m === estado.marca; }), 'Todas las marcas');
        selMarca.value = estado.marca;
      }
      if (selGenero) {
        selGenero.innerHTML = opcionesSelect(nombresGeneros.filter(function (g) { return nGenero[g] || g === estado.genero; }), 'Todos los géneros', capital);
        selGenero.value = estado.genero;
      }
      if (tituloListado) tituloListado.textContent = estado.sec ? nombreSeccion(estado.sec) : 'Todos los productos';
      flechasMarcas();
    }

    function pintarGrilla() {
      const lista = filtrados();
      anchoFoto = anchoTarjeta();
      cerrarNotas();
      grilla.innerHTML = lista.map(tarjeta).join('');
      grilla.hidden = !lista.length;
      const activos = [];
      if (estado.sec) activos.push(['sec', nombreSeccion(estado.sec)]);
      if (estado.marca) activos.push(['marca', estado.marca]);
      if (estado.genero) activos.push(['genero', capital(estado.genero)]);
      if (estado.q.trim()) activos.push(['q', '“' + estado.q.trim() + '”']);
      cuenta.innerHTML = '<span>' + (lista.length === 1 ? '1 producto' : lista.length + ' productos') + '</span>' +
        activos.map(function (a) {
          return '<button type="button" class="cat-quitar" data-quitar="' + a[0] + '" aria-label="Sacar el filtro ' + esc(a[1]) + '">' + esc(a[1]) + ICONO.cerrar + '</button>';
        }).join('') +
        (activos.length > 1 ? '<button type="button" class="cat-link" data-limpiar>Limpiar filtros</button>' : '');
      if (lista.length) {
        sinRes.hidden = true;
        sinRes.innerHTML = '';
      } else {
        sinRes.hidden = false;
        sinRes.innerHTML = bloqueVacio(ICONO.lupa, 'No encontramos nada con esa búsqueda',
          'Probá con otra palabra o sacá algún filtro.' + (hayContacto ? ' Si no lo ves, también lo conseguimos a pedido.' : ''),
          '<button type="button" class="cat-boton cat-sec-b" data-limpiar>Ver todo el catálogo</button>');
      }
      grilla.querySelectorAll('img').forEach(function (img) {
        if (img.complete && img.naturalWidth > 0) marcarCargada(img);
      });
      if (entrada) grilla.querySelectorAll('.cat-card').forEach(function (c) { entrada.observe(c); });
    }

    function actualizar() {
      // Un filtro que con los demás ya no tiene productos se suelta solo.
      if (estado.marca && !productos.some(function (p) { return p.marca === estado.marca && pasa(p, 'marca'); })) estado.marca = '';
      if (estado.genero && !productos.some(function (p) { return p.genero === estado.genero && pasa(p, 'genero'); })) estado.genero = '';
      pintarFacetas();
      pintarGrilla();
    }

    function limpiar() {
      estado.q = ''; estado.sec = ''; estado.marca = ''; estado.genero = '';
      inputQ.value = '';
      botonX.hidden = true;
      actualizar();
    }

    // Si el listado quedó lejos (se filtró desde las tarjetas de arriba), lo acerca.
    function irAlListado() {
      const destino = $('.cat-listado');
      if (!destino || typeof destino.getBoundingClientRect !== 'function' || typeof destino.scrollIntoView !== 'function') return;
      const alto = Number(window.innerHeight) || 0;
      if (alto && destino.getBoundingClientRect().top > alto * 0.55) {
        destino.scrollIntoView({ behavior: mov ? 'smooth' : 'auto', block: 'start' });
      }
    }

    // El chip elegido queda a la vista dentro de su fila (en el celular la fila se corre de costado).
    function centrarChip(chip) {
      if (typeof chips.scrollBy !== 'function' || !(chips.scrollWidth > chips.clientWidth)) return;
      const d = chip.getBoundingClientRect().left - chips.getBoundingClientRect().left;
      chips.scrollBy({ left: d - (chips.clientWidth - chip.offsetWidth) / 2, behavior: mov ? 'smooth' : 'auto' });
    }

    function flechasMarcas() {
      if (!pistaMarcas || typeof pistaMarcas.scrollLeft !== 'number') return;
      const izq = $('.cat-flecha-izq');
      const der = $('.cat-flecha-der');
      const max = pistaMarcas.scrollWidth - pistaMarcas.clientWidth;
      if (izq) izq.disabled = pistaMarcas.scrollLeft <= 4;
      if (der) der.disabled = pistaMarcas.scrollLeft >= max - 4;
    }

    function marcarCargada(img) {
      img.classList.add('cat-ok');
      const caja = img.parentNode;
      if (caja && caja.classList) caja.classList.add('cat-cargada');
    }

    // Capa de notas (acordes y notas): se arma la primera vez que se va a ver.
    function llenarNotas(capa) {
      if (!capa || capa.getAttribute('data-lleno') === '1') return;
      const p = porClave[capa.getAttribute('data-notas')];
      if (!p || !p._notas) return;
      let html = '';
      try { html = GS.notas.html(p.notas, { compacto: true }); } catch (e) { html = ''; }
      capa.innerHTML = html;
      capa.setAttribute('data-lleno', '1');
    }

    function cerrarNotas() {
      if (!notasAbierta) return;
      notasAbierta.classList.remove('cat-abierta');
      const capa = notasAbierta.querySelector('.cat-notas');
      if (capa) capa.classList.remove('gsn-abierta');
      const b = notasAbierta.querySelector('[data-ver-notas]');
      if (b) b.setAttribute('aria-expanded', 'false');
      notasAbierta = null;
    }
    instancia.cerrarNotas = cerrarNotas;

    function alternarNotas(boton) {
      const caja = boton.parentNode;
      if (!caja || !caja.classList) return;
      const abrir = !caja.classList.contains('cat-abierta');
      cerrarNotas();
      if (!abrir) return;
      const capa = caja.querySelector('.cat-notas');
      llenarNotas(capa);
      // gsn-abierta: las barras de acordes crecen al abrir (igual que al pasar el mouse).
      if (capa) capa.classList.add('gsn-abierta');
      caja.classList.add('cat-abierta');
      boton.setAttribute('aria-expanded', 'true');
      notasAbierta = caja;
    }

    function prepararNotasDe(ev) {
      const card = ev.target && ev.target.closest ? ev.target.closest('.cat-card') : null;
      if (card) llenarNotas(card.querySelector('.cat-notas'));
    }
    grilla.addEventListener('pointerover', prepararNotasDe);
    grilla.addEventListener('focusin', prepararNotasDe);

    // Foco de luz que sigue al mouse sobre la foto (sólo con mouse).
    if (mov && conMouse()) {
      grilla.addEventListener('pointermove', function (ev) {
        const f = ev.target && ev.target.closest ? ev.target.closest('.cat-foto') : null;
        if (!f) return;
        const r = f.getBoundingClientRect();
        if (!r.width) return;
        f.style.setProperty('--mx', ((ev.clientX - r.left) / r.width * 100).toFixed(1) + '%');
        f.style.setProperty('--my', ((ev.clientY - r.top) / r.height * 100).toFixed(1) + '%');
      }, { passive: true });
    }

    // Fotos: aparecen suaves al cargar y, si una URL falla, cae a la tarjeta de la marca
    // (comun_js ya lo hace con data-marca y marca data-caida; esto cubre si no estuviera).
    grilla.addEventListener('load', function (ev) {
      if (ev.target && ev.target.tagName === 'IMG') marcarCargada(ev.target);
    }, true);
    grilla.addEventListener('error', function (ev) {
      const img = ev.target;
      if (!img || img.tagName !== 'IMG' || img.dataset.generada || img.dataset.caida) return;
      img.dataset.generada = '1';
      img.removeAttribute('srcset');
      img.src = GS.tarjetaMarca(img.dataset.marca || '');
    }, true);

    if (pistaMarcas) pistaMarcas.addEventListener('scroll', flechasMarcas, { passive: true });

    let espera = null;
    inputQ.addEventListener('input', function () {
      botonX.hidden = !inputQ.value;
      clearTimeout(espera);
      espera = setTimeout(function () { estado.q = inputQ.value; pintarGrilla(); }, 140);
    });
    inputQ.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') inputQ.blur(); });
    botonX.addEventListener('click', function () {
      inputQ.value = ''; botonX.hidden = true; estado.q = ''; pintarGrilla(); inputQ.focus();
    });
    raiz.addEventListener('change', function (ev) {
      const t = ev.target;
      if (t.classList.contains('cat-f-marca')) estado.marca = t.value;
      else if (t.classList.contains('cat-f-genero')) estado.genero = t.value;
      else if (t.classList.contains('cat-f-orden')) { estado.orden = t.value; pintarGrilla(); return; }
      else return;
      actualizar();
    });
    raiz.addEventListener('click', function (ev) {
      const t = ev.target;
      const ig = t.closest('[data-ig-pedido]');
      if (ig) { pedirPorInstagram(ev, ig); return; }
      if (t.closest('[data-limpiar]')) { limpiar(); return; }
      const notasBtn = t.closest('[data-ver-notas]');
      if (notasBtn) { ev.preventDefault(); alternarNotas(notasBtn); return; }
      if (notasAbierta && t.closest('.cat-notas')) { cerrarNotas(); return; }
      const sec = t.closest('[data-sec]');
      if (sec) {
        const v = sec.getAttribute('data-sec');
        const esTarjeta = sec.classList.contains('cat-sec');
        estado.sec = esTarjeta && estado.sec === v ? '' : v;
        actualizar();
        if (esTarjeta) irAlListado();
        return;
      }
      const mb = t.closest('[data-marca-b]');
      if (mb) {
        const v = mb.getAttribute('data-marca-b');
        estado.marca = estado.marca === v ? '' : v;
        actualizar();
        irAlListado();
        return;
      }
      const gb = t.closest('[data-gen]');
      if (gb) {
        if (gb.disabled) return;
        const v = gb.getAttribute('data-gen');
        estado.genero = estado.genero === v ? '' : v;
        actualizar();
        irAlListado();
        return;
      }
      const quitar = t.closest('[data-quitar]');
      if (quitar) {
        const campo = quitar.getAttribute('data-quitar');
        if (campo === 'q') { inputQ.value = ''; botonX.hidden = true; }
        estado[campo] = '';
        actualizar();
        return;
      }
      const flecha = t.closest('[data-flecha]');
      if (flecha && pistaMarcas && typeof pistaMarcas.scrollBy === 'function') {
        pistaMarcas.scrollBy({ left: Number(flecha.getAttribute('data-flecha')) * pistaMarcas.clientWidth * 0.8, behavior: mov ? 'smooth' : 'auto' });
        return;
      }
      if (t.closest('[data-arriba]')) {
        if (typeof window.scrollTo === 'function') window.scrollTo({ top: 0, behavior: mov ? 'smooth' : 'auto' });
        return;
      }
      const env = t.closest('[data-env]');
      if (env) {
        const clave = env.getAttribute('data-env');
        if (!seleccion.has(clave)) seleccion.set(clave, 1);
        cambioSeleccion();
        abrirHoja(env);
        return;
      }
      if (t.closest('.cat-abrir-envio') || t.closest('.cat-flota')) abrirHoja(t.closest('button'));
    });

    pintarFacetas();
    pintarGrilla();

    if (!puedeCotizar) return;

    // ───── Cotizador de envío ─────
    const hoja = $('.cat-hoja');
    const velo = $('.cat-velo');
    const flota = $('.cat-flota');
    const flotaN = flota.querySelector('.cat-flota-n');
    const items = $('.cat-h-items');
    const sumar = $('.cat-h-sumar');
    const form = $('.cat-h-form');
    const inputCp = $('.cat-h-cp');
    const selProv = $('.cat-h-prov');
    const ayudaProv = $('.cat-h-prov-ayuda');
    const botonCalc = $('.cat-h-calc');
    const res = $('.cat-h-res');
    const servCaja = $('.cat-serv-caja');
    const total = $('.cat-h-total');
    const pie = $('.cat-h-pie');

    function subtotal() {
      let s = 0;
      seleccion.forEach(function (cant, clave) {
        const p = porClave[clave];
        if (p && tienePrecio(p)) s += Number(p.precio) * cant;
      });
      return s;
    }

    function sinPrecio() {
      let n = 0;
      seleccion.forEach(function (cant, clave) {
        const p = porClave[clave];
        if (p && !tienePrecio(p)) n++;
      });
      return n;
    }

    function unidades() {
      let n = 0;
      seleccion.forEach(function (c) { n += c; });
      return n;
    }

    function invalidarCotizacion() {
      cot.pedido++;
      cot.fase = 'nada';
      cot.res = null;
      cot.error = '';
    }

    function nombreProv(clave) {
      const p = envio.provincias.find(function (x) { return x.clave === clave; });
      return p ? p.nombre : clave;
    }

    function provinciasDeCp(cp) {
      const n = Number(cp);
      const out = [];
      (envio.cps || []).forEach(function (r) {
        if (n < r[0] || n > r[1]) return;
        (r[2] || []).forEach(function (i) {
          const p = envio.provincias[i];
          if (p && out.indexOf(p.clave) === -1) out.push(p.clave);
        });
      });
      return out;
    }

    // Con el CP: si es de una sola provincia se elige sola; si es compartido, se avisa entre cuáles elegir.
    function sugerirProvincia() {
      const m = inputCp.value.replace(/\s/g, '').match(/\d{4}/);
      const posibles = m ? provinciasDeCp(m[0]) : [];
      let aviso = '';
      if (posibles.length === 1 && (!cot.provincia || cot.provinciaAuto)) {
        cot.provincia = posibles[0];
        cot.provinciaAuto = true;
        selProv.value = cot.provincia;
      } else if (posibles.length > 1) {
        if (cot.provinciaAuto && posibles.indexOf(cot.provincia) === -1) { cot.provincia = ''; selProv.value = ''; }
        const nombres = posibles.map(nombreProv);
        aviso = 'Ese código postal es de ' + nombres.slice(0, -1).join(', ') + ' o ' + nombres[nombres.length - 1] + ': elegí cuál.';
      }
      ayudaProv.textContent = aviso;
      ayudaProv.hidden = !aviso;
    }

    // El servicio elegido (el que tocó el cliente o, si no, el de por defecto en envio.servicio) dentro de la cotización.
    function opcionElegida() {
      if (cot.fase !== 'ok' || !cot.res || !Array.isArray(cot.res.opciones)) return null;
      const pref = [cot.servicio, envio.servicio];
      for (let i = 0; i < pref.length; i++) {
        const op = cot.res.opciones.find(function (o) { return o.servicio === pref[i]; });
        if (op) return op;
      }
      return cot.res.opciones[0] || null;
    }

    function plazoDe(op) {
      if (!op) return '';
      const info = SERVICIO_INFO[op.servicio];
      return String(op.plazo || (info ? info.plazo : '')).trim();
    }

    function cambioSeleccion() {
      invalidarCotizacion();
      grilla.querySelectorAll('[data-env]').forEach(function (b) {
        b.setAttribute('aria-pressed', seleccion.has(b.getAttribute('data-env')) ? 'true' : 'false');
      });
      const n = unidades();
      flota.classList.toggle('cat-visible', n > 0);
      flotaN.textContent = String(n);
      flotaN.classList.remove('cat-late');
      if (n > 0 && typeof flotaN.getBoundingClientRect === 'function') {
        flotaN.getBoundingClientRect();
        flotaN.classList.add('cat-late');
      }
      flota.setAttribute('aria-label', 'Calcular envío: ' + n + (n === 1 ? ' unidad elegida' : ' unidades elegidas'));
      pintarItems();
      pintarResultado();
    }

    function pintarItems() {
      if (!seleccion.size) {
        items.innerHTML = '<div class="cat-h-vacio">Elegí abajo qué productos querés que te enviemos.</div>';
      } else {
        let html = '';
        seleccion.forEach(function (cant, clave) {
          const p = porClave[clave];
          if (!p) return;
          html += '<div class="cat-h-item">' +
            '<img ' + (p.imagen ? atributosFoto(p.imagen, 48) : 'src="' + esc(GS.tarjetaMarca(p.marca || p._nombre)) + '"') + ' alt="" loading="lazy" data-marca="' + esc(p.marca || p._nombre) + '">' +
            '<div class="cat-h-item-txt"><b>' + esc(p._nombre) + '</b><span>' + esc(tienePrecio(p) ? GS.money(p.precio) : 'Precio a consultar') + '</span></div>' +
            '<div class="cat-paso">' +
              '<button type="button" data-menos="' + esc(clave) + '" aria-label="' + (cant > 1 ? 'Uno menos' : 'Sacar') + '">' + (cant > 1 ? '−' : '×') + '</button>' +
              '<output aria-live="polite">' + cant + '</output>' +
              '<button type="button" data-mas="' + esc(clave) + '" aria-label="Uno más">+</button>' +
            '</div></div>';
        });
        items.innerHTML = html;
      }
      const libres = productos.filter(function (p) { return !seleccion.has(p._clave); })
        .slice().sort(function (a, b) { return comparar(a._nombre, b._nombre); });
      sumar.innerHTML = '<option value="">' + (seleccion.size ? '+ Sumar otro producto' : '+ Elegí un producto') + '</option>' +
        libres.map(function (p) {
          return '<option value="' + esc(p._clave) + '">' + esc(p._nombre + (tienePrecio(p) ? ' · ' + GS.money(p.precio) : '')) + '</option>';
        }).join('');
      sumar.parentNode.hidden = !libres.length;
    }

    function pintarResultado() {
      const etiqueta = MODALIDADES[cot.modalidad];
      // Con la cotización a la vista, cada opción ya dice qué es y cuánto tarda.
      if (servCaja) servCaja.hidden = cot.fase === 'ok';
      if (cot.fase === 'cargando') {
        res.innerHTML = '<div class="cat-res cat-res-cargando">Calculando el envío…</div>';
      } else if (cot.fase === 'error') {
        res.innerHTML = '<div class="cat-res cat-res-error">' + esc(cot.error) + '</div>';
      } else if (cot.fase === 'ok') {
        const r = cot.res;
        const elegida = opcionElegida();
        res.innerHTML = '<div class="cat-res cat-res-ok">Envío ' + esc(etiqueta) + ' · CP ' + esc(cot.cp) + ' (' + esc(nombreProv(r.provincia)) + ')' +
          '<div class="cat-ops" role="radiogroup" aria-label="Servicio de Correo Argentino">' + r.opciones.map(function (o) {
            const info = SERVICIO_INFO[o.servicio];
            const plazo = plazoDe(o);
            const desc = [info ? info.desc : '', plazo].filter(Boolean).join(' · ');
            return '<button type="button" class="cat-op" role="radio" data-servicio="' + esc(o.servicio) + '" aria-checked="' + (elegida === o ? 'true' : 'false') + '">' +
              '<span class="cat-op-nom">' + esc(SERVICIOS[o.servicio] || o.servicio) + '</span>' +
              (desc ? '<span class="cat-op-desc">' + esc(desc) + '</span>' : '') +
              '<b>' + esc(GS.money(o.precio)) + '</b></button>';
          }).join('') + '</div>' +
          '<small>' + esc(String(r.nota || NOTA_PLAZOS).trim()) + ' Te confirmamos el envío al cerrar el pedido.</small></div>';
      } else {
        res.innerHTML = '';
      }

      const sub = subtotal();
      const consultar = sinPrecio();
      const op = opcionElegida();
      const costoEnvio = op ? Number(op.precio) || 0 : null;
      total.innerHTML = seleccion.size && sub > 0
        ? '<div><span>Productos (' + unidades() + ')' + (consultar ? ' · ' + consultar + ' a consultar' : '') + '</span><span>' + esc(GS.money(sub)) + '</span></div>' +
          '<div><span>Envío' + (op ? ' ' + esc(SERVICIOS[op.servicio] || op.servicio) : '') + '</span><span>' + (costoEnvio === null ? 'a calcular' : esc(costoEnvio > 0 ? GS.money(costoEnvio) : 'Sin cargo')) + '</span></div>' +
          '<div class="cat-tot"><span>' + (consultar ? 'Total parcial' : 'Total') + '</span><span>' + esc(GS.money(sub + (costoEnvio || 0))) + '</span></div>'
        : '';

      pie.innerHTML = seleccion.size ? botonConsulta(textoConsulta(sub, costoEnvio, op), numeroWa ? 'Pedir por WhatsApp' : 'Pedir por Instagram', '') : '';
    }

    function textoConsulta(sub, envio, op) {
      const lineas = ['Hola! Me interesa:'];
      seleccion.forEach(function (cant, clave) {
        const p = porClave[clave];
        if (!p) return;
        lineas.push('• ' + p._nombre + (cant > 1 ? ' (x' + cant + ')' : '') + (tienePrecio(p) ? ' a ' + GS.money(p.precio) : ''));
      });
      const cp = inputCp.value.trim();
      if (envio !== null) {
        const plazo = plazoDe(op);
        lineas.push('Envío ' + MODALIDADES[cot.modalidad] + ' (' + (SERVICIOS[op.servicio] || op.servicio) + (plazo ? ', ' + plazo : '') + ') al CP ' + cot.cp +
          ', ' + nombreProv(cot.res.provincia) + ': ' + (envio > 0 ? GS.money(envio) : 'sin cargo'));
        if (sub > 0) lineas.push((sinPrecio() ? 'Total parcial: ' : 'Total: ') + GS.money(sub + envio));
      } else if (cp) {
        lineas.push('Mi código postal es ' + cp + ' (envío ' + MODALIDADES[cot.modalidad] + ').');
      }
      return lineas.join('\n');
    }

    // Con la hoja abierta, lo de atrás (tapado por el velo) queda inerte: ni el teclado ni el lector de pantalla lo alcanzan.
    const inertes = [];
    function abrirHoja(origen) {
      disparador = origen || null;
      cerrarNotas();
      pintarItems();
      pintarResultado();
      velo.classList.add('cat-abierto');
      hoja.classList.add('cat-abierto');
      document.documentElement.classList.add('cat-sin-scroll');
      Array.prototype.slice.call(raiz.children || []).forEach(function (h) {
        if (h === hoja || h === velo || !h.setAttribute || h.hasAttribute('inert')) return;
        h.setAttribute('inert', '');
        inertes.push(h);
      });
      setTimeout(function () { hoja.focus({ preventScroll: true }); }, 60);
    }

    function cerrarHoja() {
      if (!hoja.classList.contains('cat-abierto')) return false;
      velo.classList.remove('cat-abierto');
      hoja.classList.remove('cat-abierto');
      document.documentElement.classList.remove('cat-sin-scroll');
      inertes.splice(0).forEach(function (h) { h.removeAttribute('inert'); });
      if (disparador && document.body.contains(disparador)) disparador.focus({ preventScroll: true });
      return true;
    }
    instancia.cerrarHoja = cerrarHoja;
    // Por si el navegador no conoce inert: Tab da la vuelta dentro de la hoja.
    instancia.atraparTab = function (ev) {
      if (!hoja.classList.contains('cat-abierto')) return;
      const foco = Array.prototype.slice.call(hoja.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled])'))
        .filter(function (el) { return !el.closest('[hidden]'); });
      if (!foco.length) return;
      const pri = foco[0];
      const ult = foco[foco.length - 1];
      if (ev.shiftKey && (document.activeElement === pri || document.activeElement === hoja)) { ev.preventDefault(); ult.focus(); }
      else if (!ev.shiftKey && document.activeElement === ult) { ev.preventDefault(); pri.focus(); }
      else if (!hoja.contains(document.activeElement)) { ev.preventDefault(); pri.focus(); }
    };

    hoja.addEventListener('click', function (ev) {
      if (ev.target.closest('[data-cerrar]')) { cerrarHoja(); return; }
      const mas = ev.target.closest('[data-mas]');
      const menos = ev.target.closest('[data-menos]');
      if (mas) {
        const k = mas.getAttribute('data-mas');
        seleccion.set(k, Math.min(99, (seleccion.get(k) || 0) + 1));
        cambioSeleccion();
      } else if (menos) {
        const k = menos.getAttribute('data-menos');
        const n = (seleccion.get(k) || 0) - 1;
        if (n > 0) seleccion.set(k, n); else seleccion.delete(k);
        cambioSeleccion();
      }
      const servicio = ev.target.closest('[data-servicio]');
      if (servicio) {
        cot.servicio = servicio.getAttribute('data-servicio');
        pintarResultado();
        return;
      }
      const mod = ev.target.closest('[data-mod]');
      if (mod) {
        cot.modalidad = mod.getAttribute('data-mod');
        hoja.querySelectorAll('[data-mod]').forEach(function (b) {
          b.setAttribute('aria-checked', b === mod ? 'true' : 'false');
        });
        invalidarCotizacion();
        pintarResultado();
      }
    });
    velo.addEventListener('click', cerrarHoja);
    sumar.addEventListener('change', function () {
      if (!sumar.value) return;
      seleccion.set(sumar.value, 1);
      cambioSeleccion();
    });
    inputCp.addEventListener('input', function () {
      sugerirProvincia();
      if (cot.fase !== 'nada') { invalidarCotizacion(); pintarResultado(); }
    });
    selProv.addEventListener('change', function () {
      cot.provincia = selProv.value;
      cot.provinciaAuto = !selProv.value;
      sugerirProvincia();
      if (cot.fase !== 'nada') { invalidarCotizacion(); pintarResultado(); }
    });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      const cp = inputCp.value.trim();
      if (!seleccion.size) {
        cot.fase = 'error'; cot.error = 'Sumá al menos un producto para calcular el envío.';
        pintarResultado();
        return;
      }
      if (!/\d{4}/.test(cp.replace(/\s/g, ''))) {
        cot.fase = 'error'; cot.error = 'Escribí tu código postal (son 4 números, por ejemplo 2000).';
        pintarResultado();
        inputCp.focus();
        return;
      }
      if (!cot.provincia) {
        cot.fase = 'error'; cot.error = 'Elegí tu provincia.';
        pintarResultado();
        selProv.focus();
        return;
      }
      const ids = [];
      seleccion.forEach(function (cant, clave) { ids.push({ id: porClave[clave].id, cantidad: cant }); });
      const numero = ++cot.pedido;
      cot.fase = 'cargando';
      cot.cp = cp.replace(/\s/g, '').match(/\d{4}/)[0];
      botonCalc.disabled = true;
      pintarResultado();
      Promise.resolve()
        .then(function () { return opciones.cotizar({ cp: cot.cp, provincia: cot.provincia, modalidad: cot.modalidad, ids: ids }); })
        .then(function (r) {
          if (numero !== cot.pedido) return;
          if (!r || r.ok === false || !Array.isArray(r.opciones) || !r.opciones.length) {
            throw new Error((r && (r.motivo || r.error)) || 'No pudimos calcular el envío para ese código postal.');
          }
          cot.fase = 'ok';
          cot.res = r;
          pintarResultado();
        })
        .catch(function (err) {
          if (numero !== cot.pedido) return;
          cot.fase = 'error';
          cot.error = (err && err.message) || 'No pudimos calcular el envío. Probá de nuevo en un ratito.';
          pintarResultado();
        })
        .then(function () { botonCalc.disabled = false; });
    });

    pintarItems();
  }

  // Teclado y barra de progreso: una sola vez por página, para la instancia montada en ese momento.
  function instalarGlobales() {
    if (globalesInstalados) return;
    globalesInstalados = true;
    document.addEventListener('keydown', function (ev) {
      if (!instancia) return;
      if (ev.key === 'Escape') {
        if (!(instancia.cerrarHoja && instancia.cerrarHoja()) && instancia.cerrarNotas) instancia.cerrarNotas();
      } else if (ev.key === 'Tab' && instancia.atraparTab) instancia.atraparTab(ev);
    });
    if (typeof window.addEventListener !== 'function' || typeof window.requestAnimationFrame !== 'function') return;
    let pendiente = false;
    function medir() {
      pendiente = false;
      const barra = instancia && instancia.progreso;
      if (!barra) return;
      const doc = document.documentElement;
      const max = doc.scrollHeight - (window.innerHeight || doc.clientHeight);
      const y = window.scrollY || doc.scrollTop || 0;
      barra.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, y / max) : 0).toFixed(4) + ')';
    }
    window.addEventListener('scroll', function () {
      if (pendiente) return;
      pendiente = true;
      window.requestAnimationFrame(medir);
    }, { passive: true });
  }

  function htmlHoja(envio) {
    return '<button type="button" class="cat-flota" aria-label="Calcular envío">' + ICONO.camion +
        '<span>Calcular envío</span><span class="cat-flota-n">0</span></button>' +
      '<div class="cat-velo"></div>' +
      '<div class="cat-hoja" role="dialog" aria-modal="true" aria-labelledby="catHojaTitulo" tabindex="-1">' +
        '<div class="cat-hoja-asa" aria-hidden="true"></div>' +
        '<div class="cat-hoja-cab"><h2 id="catHojaTitulo">Calculá el envío</h2>' +
          '<button type="button" class="cat-x" data-cerrar aria-label="Cerrar">' + ICONO.cerrar + '</button></div>' +
        '<p class="cat-hoja-sub">Elegí los productos, poné tu código postal y te decimos cuánto sale mandarlo por Correo Argentino.</p>' +
        '<div class="cat-h-items"></div>' +
        '<label class="cat-sel cat-sel-ancho"><span class="cat-oculto">Sumar un producto</span><select class="cat-h-sumar"></select></label>' +
        '<form class="cat-h-form" novalidate>' +
          '<label class="cat-campo">Código postal<input class="cat-h-cp" name="cp" inputmode="numeric" autocomplete="postal-code" maxlength="8" placeholder="Ej.: 2000"></label>' +
          '<label class="cat-campo">Provincia<select class="cat-h-prov" name="provincia"><option value="">Elegí la provincia</option>' +
            envio.provincias.map(function (p) { return '<option value="' + esc(p.clave) + '">' + esc(p.nombre) + '</option>'; }).join('') +
            '</select><small class="cat-h-prov-ayuda" aria-live="polite" hidden></small></label>' +
          '<div class="cat-seg" role="radiogroup" aria-label="Tipo de envío">' +
            '<button type="button" role="radio" data-mod="DOMICILIO" aria-checked="true">A domicilio</button>' +
            '<button type="button" role="radio" data-mod="SUCURSAL" aria-checked="false">A sucursal</button>' +
          '</div>' +
          '<div class="cat-serv-caja"><div class="cat-serv">' + ['CLASICO', 'EXPRESO'].map(function (s) {
            return '<div class="cat-serv-i"><b>' + SERVICIOS[s] + '</b><span>' + SERVICIO_INFO[s].desc + '</span>' +
              '<span>' + ICONO.reloj + SERVICIO_INFO[s].plazo + '</span></div>';
          }).join('') + '</div>' +
          '<p class="cat-serv-nota">' + NOTA_PLAZOS + ' Después de calcular elegís cuál querés.</p></div>' +
          '<button type="submit" class="cat-boton cat-h-calc">Calcular envío</button>' +
        '</form>' +
        '<div class="cat-h-res" aria-live="polite"></div>' +
        '<div class="cat-h-total"></div>' +
        '<div class="cat-h-pie"></div>' +
      '</div>';
  }

  window.CatalogoRender = { montar: montar, aviso: aviso, esqueleto: esqueleto };
})();
</script>

<script>
(function () {
  'use strict';
  const app = document.getElementById('catalogo');
  const slug = (new URLSearchParams(location.search).get('tienda') || '').trim().toLowerCase();

  function avisar(titulo, texto, accion) {
    CatalogoRender.aviso(app, titulo, texto, accion);
  }

  function pedir(consulta) {
    return fetch(API_URL + '?' + consulta, { method: 'GET', credentials: 'omit' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
  }

  function sinOk(json) {
    const copia = Object.assign({}, json);
    delete copia.ok;
    return copia;
  }

  function ponerTitulo(nombre) {
    document.title = nombre;
    const og = document.querySelector('meta[property="og:title"]');
    if (og) og.setAttribute('content', nombre);
  }

  function ponerColorBarra() {
    const fondo = getComputedStyle(document.documentElement).getPropertyValue('--fondo').trim();
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta && fondo) meta.setAttribute('content', fondo);
  }

  function cotizar(q) {
    const lista = q.ids.map(function (x) { return x.id + ':' + x.cantidad; }).join(',');
    const consulta = 'api=cotizar&tienda=' + encodeURIComponent(slug) +
      '&cp=' + encodeURIComponent(q.cp) +
      '&provincia=' + encodeURIComponent(q.provincia) +
      '&modalidad=' + encodeURIComponent(q.modalidad) +
      '&ids=' + encodeURIComponent(lista);
    return pedir(consulta)
      .catch(function () {
        throw new Error('No pudimos conectarnos para calcular el envío. Probá de nuevo en un ratito.');
      })
      .then(function (json) {
        if (!json || json.ok === false) {
          throw new Error((json && (json.error || json.motivo)) || 'No pudimos calcular el envío para ese código postal.');
        }
        return sinOk(json);
      });
  }

  function cargar() {
    CatalogoRender.esqueleto(app);
    pedir('api=catalogo&tienda=' + encodeURIComponent(slug))
      .then(function (json) {
        if (!json || json.ok === false) {
          avisar('Catálogo no disponible',
            json && json.error && json.error !== 'Catálogo no disponible'
              ? json.error
              : 'Por ahora este catálogo no se puede ver. Probá de nuevo más tarde.');
          return;
        }
        const datos = sinOk(json);
        if (datos.marca && datos.marca.nombre) ponerTitulo(String(datos.marca.nombre));
        CatalogoRender.montar(app, datos, { cotizar: cotizar });
        ponerColorBarra();
      })
      .catch(function () {
        avisar('No pudimos cargar el catálogo', 'Revisá tu conexión a internet y probá de nuevo.',
          { texto: 'Reintentar', fn: cargar });
      });
  }

  if (!API_URL) {
    avisar('Catálogo sin configurar', 'A esta página le falta la dirección del servidor. Avisale a quien te pasó el link.');
  } else if (!slug) {
    avisar('Falta el catálogo en el link', 'Revisá que el link esté completo: tiene que terminar en ?tienda= y el nombre del catálogo.');
  } else {
    cargar();
  }
})();
</script>
