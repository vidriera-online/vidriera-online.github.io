.cat-marca-pie i,.cat-chip i{flex:none;font-style:normal;font-size:11.5px;font-weight:500;min-width:22px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,currentColor 12%,transparent);text-align:center}
.cat-chip[aria-pressed="true"] i{background:color-mix(in srgb,var(--pri-velo,transparent) 14%,transparent)}
.cat-marca-b[aria-pressed="true"]{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri),0 18px 36px -22px color-mix(in srgb,var(--pri) 90%,transparent)}
.cat-marca-b[aria-pressed="true"]::before{opacity:1}
.cat-marca-b[aria-pressed="true"] .cat-marca-logo img{opacity:1}
.cat-marca-b[aria-pressed="true"] .cat-marca-pie{color:var(--texto)}
@media (hover:hover){.cat-marca-b:hover{transform:translateY(-4px);border-color:var(--cat-linea-f);box-shadow:0 22px 44px -28px rgba(0,0,0,1)}.cat-marca-b:hover::before{opacity:1}.cat-marca-b:hover .cat-marca-logo img{opacity:1;transform:scale(1.06);filter:drop-shadow(0 0 12px rgba(255,255,255,.28))}}
.cat-marca-b:active{transform:scale(.97)}
.cat-flecha{position:absolute;top:50%;z-index:2;width:42px;height:42px;margin-top:-27px;border-radius:50%;border:1px solid var(--cat-linea-f);background:#17171B;color:var(--texto);box-shadow:0 12px 28px -14px rgba(0,0,0,.9);cursor:pointer;display:none;place-items:center;transition:opacity .3s,transform .35s var(--cat-ease),background .3s,color .3s,border-color .3s}
.cat-flecha svg{width:16px;height:16px}
.cat-flecha:hover{background:var(--pri);color:var(--pri-txt);border-color:var(--pri)}
.cat-flecha[disabled]{opacity:0;pointer-events:none}
.cat-flecha-izq{left:-18px}
.cat-flecha-der{right:-18px}
@media (hover:hover) and (pointer:fine) and (min-width:720px){.cat-flecha{display:grid}}

/* Las fotos de los géneros son cuadradas: encuadre hacia arriba (las tapas) y, desde 980 px, tarjetas 4/3 (con 16/10 se perdía casi un 40 % del alto). */
.cat-gens{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px}
.cat-gen{position:relative;display:block;aspect-ratio:4/5;padding:0;border:1px solid var(--cat-linea);border-radius:var(--radio);overflow:hidden;isolation:isolate;cursor:pointer;text-align:left;color:#fff;background:#0E0E11;transition:transform .6s var(--cat-ease),box-shadow .5s,border-color .4s,opacity .4s}
.cat-gen img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:50% 30%;transform:scale(1.02);transition:transform 1.2s var(--cat-ease)}
.cat-gen::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(8,8,10,.9) 0%,rgba(8,8,10,.4) 40%,rgba(8,8,10,0) 72%)}
.cat-gen-sinfoto{background:radial-gradient(90% 80% at 80% 10%,color-mix(in srgb,var(--pri) 26%,transparent),transparent 62%),linear-gradient(160deg,#1A1A1F,#0E0E11 60%)}
.cat-gen-sinfoto::after{display:none}
.cat-gen b{position:absolute;left:12px;right:10px;bottom:11px;font-size:clamp(16px,4.6vw,30px);font-weight:400;font-style:italic;line-height:1;letter-spacing:-.01em;text-shadow:0 2px 16px rgba(0,0,0,.6);transition:transform .6s var(--cat-ease),letter-spacing .6s var(--cat-ease)}
.cat-gen small{position:absolute;top:10px;right:10px;font-size:11px;font-weight:500;letter-spacing:.06em;padding:2px 8px;border-radius:999px;color:var(--cat-plata);background:rgba(10,10,13,.55);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cat-gen[aria-pressed="true"]{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri),0 0 0 4px color-mix(in srgb,var(--pri) 22%,transparent)}
.cat-gen[disabled]{opacity:.38;cursor:default}
@media (hover:hover){.cat-gen:not([disabled]):hover{border-color:var(--cat-linea-f)}.cat-gen:not([disabled]):hover img{transform:scale(1.08)}.cat-gen:not([disabled]):hover b{transform:translateY(-4px);letter-spacing:.01em}}
.cat-gen:not([disabled]):active{transform:scale(.98)}

/* ── envíos ── */
.cat-envio{max-width:var(--cat-max);margin:34px auto 0;padding:0 16px}
.cat-envio-in{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:18px;border-radius:calc(var(--radio) + 2px);background:linear-gradient(135deg,#16161A,#0F0F12 70%);border:1px solid var(--cat-linea)}
.cat-envio-in::before{content:"";position:absolute;z-index:-1;right:-70px;top:-90px;width:240px;height:240px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.08),transparent);pointer-events:none}
.cat-envio-ico{flex:none;position:relative;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:var(--pri-fuerte);background:rgba(255,255,255,.05);border:1px solid var(--cat-linea-f)}
.cat-envio-ico svg{width:24px;height:24px;transition:transform .6s var(--cat-ease)}
.cat-envio-in:hover .cat-envio-ico svg{transform:translateX(4px)}
.cat-envio-txt{position:relative;flex:1 1 220px;min-width:0;font-size:14px;line-height:1.45}
.cat-envio-txt b{display:block;margin-bottom:2px;font-size:16.5px;font-weight:500}
.cat-envio-txt span{color:var(--texto-suave)}
.cat-envio-txt em{font-style:normal;font-weight:600;color:var(--texto)}
.cat-envio-in .cat-boton{position:relative;flex:none}
@media (max-width:479px){.cat-envio-in .cat-boton{flex:1 1 100%}}

/* ── listado ── */
.cat-listado{scroll-margin-top:74px}
.cat-controles{max-width:var(--cat-max);margin:38px auto 0;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.cat-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.cat-chips::-webkit-scrollbar{display:none}
.cat-chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:7px 16px;border-radius:999px;border:1px solid var(--cat-linea-f);background:rgba(255,255,255,.03);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;transition:background .3s var(--cat-ease),border-color .3s,color .3s,transform .3s var(--cat-ease)}
.cat-chip:hover{border-color:rgba(255,255,255,.3)}
.cat-chip:active{transform:scale(.95)}
.cat-chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--pri-txt);animation:catPop .45s var(--cat-ease)}
.cat-filtros{display:flex;flex-wrap:wrap;gap:8px}
.cat-sel{position:relative;flex:1 1 150px;display:block}
.cat-sel select{width:100%;height:44px;padding:0 34px 0 14px;border-radius:12px;border:1px solid var(--cat-linea-f);background:#141417;font-size:14.5px;cursor:pointer;-webkit-appearance:none;appearance:none;transition:border-color .25s,box-shadow .3s}
.cat-sel select:hover{border-color:rgba(255,255,255,.3)}
.cat-sel::after{content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;margin-top:-6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);opacity:.55;pointer-events:none}
.cat-sel select:focus-visible,.cat-chip:focus-visible,.cat-boton:focus-visible,.cat-wa:focus-visible,.cat-env:focus-visible{outline:2px solid var(--pri-fuerte);outline-offset:2px}
.cat-cuenta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;color:var(--texto-suave)}
.cat-cuenta>span{margin-right:2px}
.cat-quitar{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 8px 4px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--pri) 50%,transparent);background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--texto);font-size:13px;font-weight:500;cursor:pointer;animation:catPop .4s var(--cat-ease);transition:background .25s}
.cat-quitar:hover{background:color-mix(in srgb,var(--pri) 20%,transparent)}
.cat-quitar svg{width:13px;height:13px}
.cat-link{display:inline-flex;align-items:center;min-height:40px;border:0;background:none;padding:0 4px;cursor:pointer;color:var(--texto);font-weight:500;text-decoration:underline;text-underline-offset:3px}

.cat-grilla{max-width:var(--cat-max);margin:18px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.cat-grilla{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.cat-hero-in{padding:48px 24px 44px;column-gap:28px;row-gap:0;grid-template-rows:auto auto}.cat-hero-in>.cat-logo,.cat-hero-in>.cat-mono{grid-row:1/span 2}.cat-hero-txt{align-self:end}.cat-hero-pie{grid-column:2;margin-top:18px;align-self:start}.cat-hero-vit{grid-column:1/-1;grid-row:auto;height:264px;margin:18px 0 0}.cat-hv-0{width:150px;left:calc(50% - 196px);top:70px}.cat-hv-1{width:190px;left:calc(50% - 95px);top:20px}.cat-hv-2{width:150px;left:calc(50% + 46px);top:70px}.cat-aro{width:370px;height:370px;margin-left:-185px}.cat-logo,.cat-mono{width:108px;height:108px;border-radius:30px}.cat-mono{font-size:40px}.cat-barra-in,.cat-vitrina,.cat-controles,.cat-envio,.cat-grilla,.cat-apedido,.cat-pie{padding-left:24px;padding-right:24px}.cat-chips,.cat-secs,.cat-marcas{margin:0 -24px;padding-left:24px;padding-right:24px;scroll-padding:0 24px}.cat-secs{grid-auto-columns:46%}.cat-marcas{grid-auto-columns:160px;gap:12px}.cat-marca-b{height:130px}.cat-gens{gap:14px}}
@media (min-width:980px){.cat-grilla{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.cat-filtros{flex-wrap:nowrap}.cat-sel{flex:0 1 230px}.cat-hero-in{grid-template-columns:auto minmax(0,1fr) 440px;padding:60px 24px 60px}.cat-hero-vit{grid-column:3;grid-row:1/span 2;height:340px;margin:0}.cat-hv-0{width:172px;left:calc(50% - 212px);top:96px}.cat-hv-1{width:222px;left:calc(50% - 111px);top:34px}.cat-hv-2{width:172px;left:calc(50% + 40px);top:96px}.cat-aro{top:0;width:420px;height:420px;margin-left:-210px}.cat-secs{grid-auto-flow:row;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-columns:auto;overflow:visible;margin:0;padding:6px 0 10px;gap:16px}.cat-sec{grid-column:span var(--span,2);aspect-ratio:auto;height:clamp(210px,20vw,280px)}.cat-vitrina{gap:46px;padding-top:40px}.cat-gen{aspect-ratio:4/3}}
@media (min-width:1280px){.cat-grilla{grid-template-columns:repeat(5,minmax(0,1fr))}}

/* Tarjeta: la foto (fondo plateado sobre negro) va de borde a borde y se funde con la tarjeta, del mismo grafito. */
.cat-card{position:relative;display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,var(--cat-tarjeta) 0%,var(--cat-tarjeta-2) 100%);border:1px solid var(--cat-linea);border-radius:var(--radio);overflow:hidden;transition:transform .55s var(--cat-ease),box-shadow .55s var(--cat-ease),border-color .4s,opacity .8s var(--cat-ease) calc(var(--k,0) * 65ms),translate 1s var(--cat-ease) calc(var(--k,0) * 65ms)}
.cat-io .cat-card:not(.cat-entro){opacity:0;translate:0 26px}
@media (hover:hover){.cat-card:hover{transform:translateY(-6px);border-color:var(--cat-linea-f);box-shadow:0 34px 60px -34px rgba(0,0,0,1),0 0 44px -22px color-mix(in srgb,var(--pri) 75%,transparent)}.cat-card:hover .cat-foto img.cat-ok{transform:scale(1.06)}}
.cat-foto{position:relative;aspect-ratio:1/1;background:var(--cat-tarjeta);overflow:hidden;isolation:isolate}
/* Brillo de carga: sólo en las tarjetas que ya entraron en pantalla y con transform (no repinta en cada cuadro). */
.cat-foto::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);transform:translateX(-100%);transition:opacity .4s;pointer-events:none}
.cat-entro .cat-foto:not(.cat-cargada)::before{animation:catBarrido 1.5s ease-in-out infinite}
.cat-foto.cat-cargada::before{opacity:0;animation:none}
.cat-foto img{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(1.04);transition:opacity .7s var(--cat-ease),transform 1.1s var(--cat-ease)}
.cat-foto-llena img{object-fit:cover;-webkit-mask-image:linear-gradient(180deg,#000 74%,transparent 100%);mask-image:linear-gradient(180deg,#000 74%,transparent 100%)}
/* Foto de fondo blanco: va sobre una placa clara dentro de la tarjeta oscura, como foto de estudio. */
.cat-foto-blanca img{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);padding:6%;border-radius:calc(var(--radio) - 6px);background:radial-gradient(120% 90% at 50% 18%,#FFFFFF 0%,#F1F2F4 60%,#E2E4E8 100%)}
.cat-foto img.cat-ok{opacity:1;transform:none}
.cat-foto::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.2),color-mix(in srgb,var(--pri) 14%,transparent) 45%,transparent 72%);mix-blend-mode:screen;opacity:0;transition:opacity .5s}
@media (hover:hover) and (pointer:fine){.cat-card:hover .cat-foto::after{opacity:1}}
.cat-notas{position:absolute;z-index:3;left:0;right:0;top:0;aspect-ratio:1/1;display:flex;flex-direction:column;padding:14px;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;background:var(--sup);color:var(--texto);font-size:12.5px;line-height:1.4;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .45s var(--cat-ease),transform .45s var(--cat-ease),visibility 0s linear .45s}
@media (hover:hover){.cat-card:hover .cat-notas,.cat-card:focus-within .cat-notas{opacity:1;visibility:visible;transform:none;transition-delay:0s}}
.cat-card.cat-abierta .cat-notas{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.cat-notas::-webkit-scrollbar{display:none}
.cat-notas>.gsn{margin-block:auto;width:100%}
.cat-notas .gsn-notas{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat-card.cat-abierta .cat-notas,.cat-card:has(.cat-notas-btn:focus-visible) .cat-notas{padding-top:46px}
@media (hover:none){.cat-notas{bottom:0;aspect-ratio:auto;padding:54px 14px 16px}.cat-notas>.gsn{margin-top:0}.cat-notas .gsn-notas{-webkit-line-clamp:4}}
.cat-notas-btn{position:absolute;top:10px;left:10px;z-index:5;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px 0 10px;border-radius:999px;border:1px solid var(--cat-linea-f);background:rgba(10,10,13,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--texto);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:opacity .35s,transform .45s var(--cat-ease),background .25s}
.cat-notas-btn::before{content:"";position:absolute;inset:-6px}
.cat-notas-btn svg{width:14px;height:14px;flex:none;color:var(--pri-fuerte);transition:transform .45s var(--cat-ease)}
.cat-notas-btn[aria-expanded="true"]{background:var(--pri);color:var(--pri-txt);border-color:var(--pri)}
.cat-notas-btn[aria-expanded="true"] svg{color:inherit;transform:rotate(180deg)}
@media (hover:hover){.cat-notas-btn{opacity:0;transform:translateY(-6px);pointer-events:none}.cat-notas-btn:focus-visible,.cat-notas-btn[aria-expanded="true"]{opacity:1;transform:none;pointer-events:auto}}
/* Con var() adentro, un color-mix que el navegador no conoce (Safari < 16.2, Chrome < 111) deja el fondo transparente
   aunque haya otro antes: los velos y los brillos del acento van acá y afuera queda el color liso. */
@supports (color:color-mix(in srgb,red 50%,blue)){
.cat{background:radial-gradient(1100px 620px at 88% -8%,color-mix(in srgb,var(--pri) 10%,transparent),transparent 62%),radial-gradient(900px 520px at -12% 26%,rgba(46,48,56,.45),transparent 62%),var(--fondo)}
.cat-hero:not(.cat-hero-esq){background:radial-gradient(56% 85% at 88% -8%,color-mix(in srgb,var(--pri) 24%,transparent),transparent 72%),radial-gradient(120% 85% at 50% 0%,#17171C 0%,var(--fondo) 64%)}
.cat-hero::before{background:radial-gradient(closest-side,color-mix(in srgb,var(--sec) 16%,transparent),transparent)}
.cat-barra{background:color-mix(in srgb,var(--fondo) 80%,transparent)}
.cat-barra.cat-pegada{background:color-mix(in srgb,var(--fondo) 72%,transparent)}
.cat-envio-in::before{background:radial-gradient(closest-side,color-mix(in srgb,var(--pri) 22%,transparent),transparent)}
.cat-notas{background:radial-gradient(110% 70% at 50% 112%,color-mix(in srgb,var(--pri) 26%,transparent),transparent 70%),radial-gradient(120% 90% at 50% 0%,#1C1C21 0%,#111114 70%)}
.cat-red{background:color-mix(in srgb,var(--pri-velo,transparent) 6%,var(--pri))}
.cat-red.cat-red-sec{background:rgba(255,255,255,.04)}
.cat-red.cat-red-sec:hover{background:rgba(255,255,255,.08)}
}
.cat-info{flex:1;display:flex;flex-direction:column;gap:3px;padding:12px 14px 14px}
.cat-marca{font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--cat-plata-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-nombre{margin:0;font-size:15.5px;font-weight:500;line-height:1.25;letter-spacing:-.005em;color:var(--texto);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat-specs{font-size:12.5px;color:var(--texto-suave)}
.cat-precio{margin-top:auto;padding-top:10px;font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.1;color:#fff;font-variant-numeric:tabular-nums}
.cat-precio.cat-consultar{font-size:16px;font-weight:500}
.cat-cuotas{font-size:12.5px;color:var(--texto-suave);margin-top:3px}
.cat-acciones{display:flex;gap:6px;margin-top:12px}
.cat-wa{position:relative;overflow:hidden;isolation:isolate;flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 8px;border-radius:12px;background:var(--pri);color:var(--pri-txt)!important;text-decoration:none;font-weight:500;font-size:14.5px;letter-spacing:.01em;white-space:nowrap;transition:transform .3s var(--cat-ease),box-shadow .4s var(--cat-ease),filter .2s}
.cat-wa::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.32) 50%,transparent 70%);transform:translateX(-130%);transition:transform .9s var(--cat-ease);pointer-events:none}
.cat-wa span{overflow:hidden;text-overflow:ellipsis}
.cat-wa:hover{filter:brightness(1.06);box-shadow:0 14px 28px -14px color-mix(in srgb,var(--pri) 90%,transparent)}
.cat-wa:hover::after{transform:translateX(130%)}
.cat-wa:active{transform:scale(.97)}
.cat-wa svg{width:17px;height:17px;flex:none}
.cat-env{flex:none;width:42px;min-height:42px;border-radius:12px;border:1px solid var(--cat-linea-f);background:rgba(255,255,255,.03);cursor:pointer;display:grid;place-items:center;color:var(--texto);transition:background .25s,border-color .25s,transform .3s var(--cat-ease),color .25s}
.cat-env:hover{border-color:rgba(255,255,255,.32)}
.cat-env:active{transform:scale(.92)}
.cat-env svg{width:20px;height:20px}
.cat-env[aria-pressed="true"]{border-color:var(--pri);color:var(--pri-fuerte);background:color-mix(in srgb,var(--pri) 16%,transparent)}
.cat-env[aria-pressed="true"] svg{animation:catPop .45s var(--cat-ease)}
@media (max-width:380px){.cat-info{padding:11px 10px 12px}.cat-precio{font-size:19.5px}.cat-nombre{font-size:14.5px}}
@media (max-width:340px){.cat-acciones .cat-wa span{display:none}}

.cat-vacio{max-width:520px;margin:28px auto 0;padding:40px 20px;text-align:center}
.cat-vacio-ico{width:80px;height:80px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;color:var(--pri-fuerte);background:rgba(255,255,255,.04);border:1px solid var(--cat-linea-f);box-shadow:0 0 50px -14px color-mix(in srgb,var(--pri) 70%,transparent)}
.cat-vacio-ico svg{width:34px;height:34px}
.cat-vacio h2{margin:0 0 8px;font-size:24px;font-weight:400;letter-spacing:-.01em}

    { clave: 'RELOJES', nombre: 'Relojes', prop: 1.334 },
    { clave: 'BEBIDAS', nombre: 'Bebidas', prop: 1.334 }
  ];
  // Proporción que se supone para una foto de sección que no está en la tabla: la más apaisada que se usa, con margen.
  const PROP_DESCONOCIDA = 1.6;
  // Encuadre de una foto de sección cuadrada en una tarjeta apaisada: los frascos están arriba del centro, y centrada
  // se cortaban las tapas contra el borde (y la más alta quedaba debajo del botón "→").
  const ENCUADRE_CUADRADA = '50% 20%';

  const ORDENES = [
    ['marca', 'Marca (A–Z)'],
    ['destacados', 'Destacados'],
    ['precio-asc', 'Menor precio'],
    ['precio-desc', 'Mayor precio'],
    ['nombre', 'Nombre (A–Z)']
  ];
  const MODALIDADES = { DOMICILIO: 'a domicilio', SUCURSAL: 'a sucursal de Correo Argentino' };
  const SERVICIOS = { CLASICO: 'Clásico', EXPRESO: 'Expreso' };
  // Plazos estimados de Correo Argentino (los mismos que devuelve la cotización en "plazo").
  const SERVICIO_INFO = {
    CLASICO: { desc: 'El más económico', plazo: '2 a 5 días hábiles' },
    EXPRESO: { desc: 'El más rápido', plazo: '1 a 3 días hábiles' }
  };
  const NOTA_PLAZOS = 'Plazos estimados de Correo Argentino.';

  let globalesInstalados = false;
  let instancia = null;

  function esc(s) { return GS.esc(s == null ? '' : String(s)); }

  // Sin tildes ni apóstrofos: "victorias secret" y "Victoria’s Secret" (el ’ que pone el iPhone) encuentran lo mismo.
  function norm(s) {
    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/['’‘`´]/g, '').toLowerCase();
  }

  function comparar(a, b) {
    return String(a == null ? '' : a).localeCompare(String(b == null ? '' : b), 'es', { sensitivity: 'base', numeric: true });
  }

  // Los nombres de la planilla a veces traen notas internas entre corchetes: no se muestran.
  function limpiarNombre(s) {
    return String(s == null ? '' : s).replace(/\s*\[[^\]]*\]\s*/g, ' ').replace(/\s+/g, ' ').trim();
  }

  // "Afnan 9PM Black" bajo la marca "Afnan" se muestra como "9PM Black".
  function nombreSinMarca(nombre, marca) {
    const m = String(marca || '').trim();
    if (m && nombre.length > m.length + 1 && norm(nombre.slice(0, m.length)) === norm(m) && /\s/.test(nombre.charAt(m.length))) {
      return nombre.slice(m.length).trim();
    }
    return nombre;
  }

  function capital(s) {
    const t = String(s == null ? '' : s).trim().toLowerCase();
    return t ? t.charAt(0).toUpperCase() + t.slice(1) : '';
  }

  // "Victoria's Secret", "VICTORIA’S SECRET" y "Victorias Secret" son la misma sección.
  function claveSeccion(s) {
    return norm(s).replace(/['’`´]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
  }
  const SECCION_POR_CLAVE = {};
  SECCIONES.forEach(function (s, i) { SECCION_POR_CLAVE[claveSeccion(s.clave)] = Object.assign({ rango: i }, s); });

  function specs(p) {
    const partes = [];
    const ml = p.ml == null ? '' : String(p.ml).trim();
    if (ml) partes.push(/^\d+([.,]\d+)?$/.test(ml) ? ml + ' ml' : ml);
    if (p.genero) partes.push(capital(p.genero));
    return partes.join(' · ');
  }

  function iniciales(nombre) {
    const pal = String(nombre || '').trim().split(/\s+/).filter(Boolean);
    return ((pal[0] || '').charAt(0) + (pal[1] || '').charAt(0)).toUpperCase() || '·';
  }

  function srcLogo(logo) {
    return /^data:image\//i.test(logo) ? logo : GS.img(logo, 320);
  }

  // mlstatic sirve cada foto en WebP y en tres tamaños cambiando el final de la dirección
  // (-V: 320 px, -O: 500 px, -F: 1200 px). El resto pasa por GS.img (el otro CDN de fotos toma el ancho
  // de width= y entrega WebP si el navegador lo acepta).
  const RE_ML = /^(https?:\/\/http2\.mlstatic\.com\/D_(?:NQ_NP_)?(?:2X_)?\d+-ML[A-Z]\d+_\d+)-[A-Z]\.(?:jpe?g|webp|png)(?:\?.*)?$/i;
  function foto(url, ancho) {
    const u = String(url == null ? '' : url).trim();
    const m = RE_ML.exec(u);
    if (m) return m[1] + '-' + (ancho <= 320 ? 'V' : ancho <= 500 ? 'O' : 'F') + '.webp';
    return GS.img(u, ancho);
  }

  /**
   * src + srcset 1x/2x/3x para una foto mostrada a `ancho` px (sin srcset si la dirección no cambia con el ancho). El 3x
   * es para los iPhone: con sólo 2x, una tarjeta de 171 px en una pantalla 3x estiraba la foto de 400 px.
   */
  function atributosFoto(url, ancho) {
    const a = foto(url, ancho);
    const b = foto(url, ancho * 2);
    if (!b || b === a) return 'src="' + esc(a) + '"';
    const c = foto(url, Math.min(1600, ancho * 3));
    return 'src="' + esc(a) + '" srcset="' + esc(a) + ' 1x, ' + esc(b) + ' 2x' + (c && c !== b ? ', ' + esc(c) + ' 3x' : '') + '"';
  }

  /**
   * Foto que cubre una caja (object-fit: cover) y que necesita `ancho` px de CSS (GS.anchoParaCubrir): 1x, 2x y 3x
   * si el servidor la achica al ancho pedido; si no, va tal cual (las fotos de las secciones son de 1254 a 1536 px,
   * más de lo que pide cualquier tarjeta en una pantalla 2x).
   */
  function atributosCubrir(url, ancho) {
    const u = String(url == null ? '' : url).trim();
    if (!GS.redimensionable(u)) return 'src="' + esc(u) + '"';
    const anchos = [1, 2, 3].map(function (x) { return Math.min(1600, Math.ceil(ancho * x / 40) * 40); });
    return 'src="' + esc(GS.img(u, anchos[0])) + '" srcset="' + anchos.map(function (w, i) { return esc(GS.img(u, w)) + ' ' + (i + 1) + 'x'; }).join(', ') + '"';
  }

  /** {CLAVE normalizada: url https} de datos.fotosSecciones (las claves pueden venir como "Femenino" o "VICTORIA'S SECRET"). */
  function mapaFotosSecciones(fotos) {
    const mapa = {};
    if (!fotos || typeof fotos !== 'object') return mapa;
    Object.keys(fotos).forEach(function (k) {
      const url = String(fotos[k] == null ? '' : fotos[k]).trim();
      if (/^https:\/\//i.test(url)) mapa[claveSeccion(k)] = url;
    });
    return mapa;
  }

  /** Columnas (de 6) que ocupa cada tarjeta de sección en pantallas anchas: filas de 3 y la última sin huecos. */
  function columnasSecciones(n) {
    const spans = [];
    for (let i = 0; i < n; i++) spans.push(2);
    const resto = n % 3;
    if (resto === 2) { spans[n - 1] = 3; spans[n - 2] = 3; }
    else if (resto === 1 && n >= 4) { for (let i = n - 4; i < n; i++) spans[i] = 3; }
    else if (n === 1) spans[0] = 6;
    return spans;
  }

  /** Ancho y alto (px de CSS) de la tarjeta de sección i, con las mismas medidas que el CSS (.cat-secs, .cat-sec). */
  function cajaSeccion(spans, i) {
    const vw = anchoVentana();
    if (vw >= 980) {
      const col = (Math.min(vw, 1240) - 48 - 5 * 16) / 6;
      const ancho = col * spans[i] + 16 * (spans[i] - 1);
      return { ancho: ancho, alto: Math.min(280, Math.max(210, vw * 0.2)) };
    }
    const ancho = vw >= 640 ? (vw - 48) * 0.46 : (vw - 32) * 0.78;
    return { ancho: ancho, alto: ancho * 3 / 4 };
  }

  /** Ancho y alto (px de CSS) de una tarjeta de género con n géneros (.cat-gens, .cat-gen). */
  function cajaGenero(n) {
    const vw = anchoVentana();
    const gap = vw >= 640 ? 14 : 10;
    const ancho = (Math.min(vw, 1240) - (vw >= 640 ? 48 : 32) - gap * (n - 1)) / n;
    return { ancho: ancho, alto: vw >= 980 ? ancho * 3 / 4 : ancho * 5 / 4 };
  }

  function anchoRedondo(px) {
    return Math.min(800, Math.max(120, Math.ceil(px / 40) * 40));
  }

  function anchoVentana() {
    const w = Number(window.innerWidth);
    return w > 0 ? w : 390;
  }

  // Ancho real de una tarjeta de la grilla (las mismas columnas y márgenes que el CSS).
  function anchoTarjeta() {
    const vw = anchoVentana();
    const cols = vw >= 1280 ? 5 : vw >= 980 ? 4 : vw >= 640 ? 3 : 2;
    const pad = vw >= 640 ? 48 : 32;
    const gap = vw >= 980 ? 18 : vw >= 640 ? 16 : 12;
    return anchoRedondo((Math.min(vw, 1240) - pad - gap * (cols - 1)) / cols);
  }

  function movimientoReducido() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function conMouse() {
    return !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches);
  }

  function tienePrecio(p) { return Number(p.precio) > 0; }

  // Las notas se muestran con GS.notas (notas_js); sin ese parcial, la tarjeta va sin capa de notas.
  function tieneNotas(n) {
    return !!(window.GS && GS.notas && typeof GS.notas.html === 'function' && typeof GS.notas.hay === 'function' && GS.notas.hay(n));
  }

  const AVISO_IG_COPIADO = 'Copiamos tu pedido: pegalo en el chat';

  function textoProducto(p) {
    return tienePrecio(p)
      ? 'Hola! Me interesa ' + p._nombre + ' a ' + GS.money(p.precio)
      : 'Hola! Me interesa ' + p._nombre;
  }

  function seccionDe(p) { return String(p.seccion || p.categoria || '').trim(); }

  // "Destacados": perfumes primero (100 ml, después 30 ml), con foto adelante; el resto conserva el orden del servidor.
  const RANGO_CATEGORIA = { 'PERFUMES': 0, 'PERFUMES 30ML': 1 };
  function rangoDestacado(p, i) {
    const cat = String(p.categoria || '').trim().toUpperCase();
    const rango = Object.prototype.hasOwnProperty.call(RANGO_CATEGORIA, cat) ? RANGO_CATEGORIA[cat] : 5;
    return rango * 1e6 + (p.imagen ? 0 : 5e5) + i;

  function prepararProductos(lista) {
    return lista.filter(function (p) { return p && p.id != null; })
      .map(function (p, i) { return { p: p, r: rangoDestacado(p, i) }; })
      .sort(function (a, b) { return a.r - b.r; })

        const p = x.p;
        const nombre = limpiarNombre(p.producto);
        const sec = seccionDe(p);
        const clave = claveSeccion(sec);
        const info = SECCION_POR_CLAVE[clave];
        return Object.assign({}, p, {
          _orden: i,
          _clave: String(p.id),
          _nombre: nombre,
          _corto: nombreSinMarca(nombre, p.marca),
          _specs: specs(p),
          _sec: clave,
          _secNombre: info ? info.nombre : capital(sec),
          _notas: tieneNotas(p.notas),

      });
  }

  /** Secciones con productos, en el orden de SECCIONES (las que no conoce, al final y por nombre). */
  function armarSecciones(productos) {
    const mapa = {};
    productos.forEach(function (p) {
      if (!p._sec) return;
      if (!mapa[p._sec]) {
        const info = SECCION_POR_CLAVE[p._sec];
        mapa[p._sec] = { clave: p._sec, nombre: p._secNombre, prop: info ? info.prop : PROP_DESCONOCIDA, rango: info ? info.rango : 99, n: 0 };
      }
      mapa[p._sec].n++;
    });
    return Object.keys(mapa).map(function (k) { return mapa[k]; })
      .sort(function (a, b) { return a.rango - b.rango || comparar(a.nombre, b.nombre); });
  }

  function armarMarcas(productos) {
    const mapa = {};
    productos.forEach(function (p) {
      const m = String(p.marca || '').trim();
      if (!m) return;
      if (!mapa[m]) mapa[m] = { nombre: m, logo: '', n: 0 };
      mapa[m].n++;
      const logo = String(p.marcaLogo || '').trim();
      if (logo && !mapa[m].logo && /^https:\/\//i.test(logo)) mapa[m].logo = logo;
    });
    return Object.keys(mapa).map(function (k) { return mapa[k]; }).sort(function (a, b) { return comparar(a.nombre, b.nombre); });
  }

  function armarGeneros(productos) {
    const mapa = {};
    productos.forEach(function (p) {
      const g = String(p.genero || '').trim();
      if (!g) return;
      if (!mapa[g]) mapa[g] = { nombre: g, n: 0 };
      mapa[g].n++;
    });
    return Object.keys(mapa).map(function (k) { return mapa[k]; }).sort(function (a, b) { return comparar(a.nombre, b.nombre); });

  function opcionesSelect(valores, etiquetaTodas, rotulo) {
    return '<option value="">' + esc(etiquetaTodas) + '</option>' + valores.map(function (v) {

  function bloqueVacio(icono, titulo, texto, botonHtml) {

      (texto ? '<p>' + esc(texto) + '</p>' : '') + (botonHtml || '') + '</div>';
  }

  function desmontar() {
    if (instancia && typeof instancia.limpiar === 'function') instancia.limpiar();
    instancia = null;
  }

  /** Pantalla de aviso (catálogo pausado, error de carga, link incompleto). accion = {texto, fn} opcional. */
  function aviso(contenedor, titulo, texto, accion) {
    desmontar();
    GS.tema.aplicar(GS.tema.oscuro({}), 'OSCURO');
    const boton = accion ? '<button type="button" class="cat-boton" data-aviso-accion>' + esc(accion.texto) + '</button>' : '';
    contenedor.innerHTML = '<div class="cat cat-solo' + (movimientoReducido() ? '' : ' cat-mov') + '">' + bloqueVacio(ICONO.alerta, titulo, texto, boton) + '</div>';
    if (accion) {

    }
  }

  /**
   * Esqueleto mientras se cargan los datos (lo usa el catálogo estático): el tema oscuro con el acento plateado, sin
   * colores de marca, para que no destelle otra marca.
   */
  function esqueleto(contenedor) {
    GS.tema.aplicar(GS.tema.oscuro({}), 'OSCURO');
    let tarjetas = '';
    for (let i = 0; i < 8; i++) {
      tarjetas += '<div class="cat-esq-card"><div class="cat-esq cat-esq-foto"></div><div class="cat-esq cat-esq-linea" style="width:45%"></div><div class="cat-esq cat-esq-linea" style="width:80%"></div><div class="cat-esq cat-esq-linea" style="width:55%;height:20px"></div></div>';
    }
    contenedor.innerHTML = '<div class="cat" aria-busy="true"><div class="cat-hero cat-hero-esq"><div class="cat-hero-in"><div class="cat-mono cat-esq"></div><div class="cat-hero-txt"><h1>&nbsp;</h1></div></div></div>' +
      '<div class="cat-esq-fila"><div class="cat-esq cat-esq-sec"></div><div class="cat-esq cat-esq-sec"></div><div class="cat-esq cat-esq-sec"></div></div>' +
      '<div class="cat-grilla">' + tarjetas + '</div></div>';
  }

  function tituloPartido(texto) {

  /**
   * Monta el catálogo público.
   * datos: resultado de rpcPublico 'catalogo' sin la clave ok.
   * opciones.cotizar({cp, provincia, modalidad, ids}) → Promise del resultado de cotizar (sólo si datos.cotizador).
   */
  function montar(contenedor, datos, opciones) {
    if (!contenedor) throw new Error('CatalogoRender.montar necesita un contenedor.');
    opciones = opciones || {};
    if (!datos || !Array.isArray(datos.productos)) {
      aviso(contenedor, 'Catálogo no disponible', 'Por ahora este catálogo no se puede ver. Probá de nuevo más tarde.');

    const marca = datos.marca || {};
    // Todas las marcas con la misma estética oscura; el color del logo, como acento (GS.tema.oscuro lo aclara si no se ve).
    const oscuro = GS.tema.aplicar(GS.tema.oscuro(marca.colores || {}), 'OSCURO');
    // La caja del logo lleva los colores de la marca: su fondo y, para la inicial, su principal (con contraste sobre ese fondo).
    const placa = marca.colores ? GS.tema.calcular(marca.colores, marca.tema) : null;
    const fotosSec = mapaFotosSecciones(datos.fotosSecciones);

    const nombreMarca = String(marca.nombre || '').trim() || 'Catálogo';
    const numeroWa = String(marca.whatsapp || '').trim();
    const usuarioIg = String(marca.instagram || '').trim();
    const linkIg = usuarioIg ? GS.ig(usuarioIg) : '';
    // Sin WhatsApp ni Instagram no hay cómo pedir: no se ofrece el cotizador ni textos que inviten a escribir.
    const hayContacto = !!(numeroWa || linkIg);
    const productos = prepararProductos(datos.productos);
    const porClave = {};
    productos.forEach(function (p) { porClave[p._clave] = p; });
    const envio = datos.envio && Array.isArray(datos.envio.provincias) ? datos.envio : null;
    const puedeCotizar = hayContacto && !!datos.cotizador && !!envio && typeof opciones.cotizar === 'function' && productos.length > 0;

    const secciones = armarSecciones(productos);
    const marcas = armarMarcas(productos);
    const generos = armarGeneros(productos);
    const nombresMarcas = marcas.map(function (m) { return m.nombre; });
    const nombresGeneros = generos.map(function (g) { return g.nombre; });
    const maxCuotas = productos.reduce(function (n, p) {
      return p.cuotas && Number(p.cuotas.n) > 1 && Number(p.cuotas.monto) > 0 ? Math.max(n, Number(p.cuotas.n)) : n;
    }, 0);

    const mov = !movimientoReducido();
    const io = mov && typeof window.IntersectionObserver === 'function';

    const estado = { q: '', sec: '', marca: '', genero: '', orden: 'marca' };
    const seleccion = new Map();
    const cot = { modalidad: 'DOMICILIO', provincia: '', provinciaAuto: true, servicio: '', fase: 'nada', res: null, error: '', pedido: 0, cp: '' };
    let disparador = null;
    let anchoFoto = anchoTarjeta();

    function botonConsulta(texto, etiqueta, claseExtra) {
      if (numeroWa) {
        return '<a class="cat-wa' + (claseExtra || '') + '" href="' + esc(GS.wa(numeroWa, texto)) + '" target="_blank" rel="noopener">' + ICONO.wa + '<span>' + esc(etiqueta) + '</span></a>';
      }
      // Instagram no acepta un mensaje en el link: el pedido se copia al tocar (pedirPorInstagram) y se abre el perfil.
      if (linkIg) {
        return '<a class="cat-wa' + (claseExtra || '') + '" href="' + esc(linkIg) + '" target="_blank" rel="noopener" data-ig-pedido="' + esc(texto) + '">' + ICONO.ig + '<span>' + esc(etiqueta) + '</span></a>';
      }
      return '';
    }

    /**
     * "Pedir" por Instagram: copia el mismo texto que llevaría el WhatsApp y deja que el link abra el perfil. Si el
     * navegador no deja copiar en el toque, prueba con el portapapeles y abre el perfil; si tampoco, muestra el texto
     * para copiarlo a mano con el botón para abrir Instagram.
     */
    function pedirPorInstagram(ev, enlace) {
      const texto = enlace.getAttribute('data-ig-pedido') || '';
      const link = enlace.getAttribute('href') || linkIg;
      if (GS.copiarYa(texto)) { GS.toast(AVISO_IG_COPIADO, 'ok', 6000); return; }
      ev.preventDefault();
      const portapapeles = window.navigator && navigator.clipboard && window.isSecureContext;
      if (!portapapeles) { copiaManual(texto, link, false); return; }
      navigator.clipboard.writeText(texto).then(function () {

        if (ventana) { try { ventana.opener = null; } catch (e) { /* otra ventana: no importa */ } } else copiaManual(texto, link, true);
      }, function () { copiaManual(texto, link, false); });
    }

    function copiaManual(texto, link, copiado) {
      const previo = document.activeElement;
      const fondo = document.createElement('div');
      fondo.className = 'cat-copia-fondo';
      fondo.innerHTML = '<div class="cat-copia" role="dialog" aria-modal="true" aria-labelledby="catCopiaTit">' +
        '<h2 id="catCopiaTit">Pedir por Instagram</h2>' +
        '<p>' + (copiado ? 'Ya copiamos tu pedido: tocá Abrir Instagram y pegalo en el chat.'
          : 'Copiá tu pedido (mantené apretado el texto y elegí Copiar), tocá Abrir Instagram y pegalo en el chat.') + '</p>' +
        '<textarea class="cat-copia-txt" readonly rows="5" aria-label="Tu pedido">' + esc(texto) + '</textarea>' +
        '<div class="cat-copia-acc"><button type="button" class="cat-boton cat-sec-b" data-copia-cerrar>Cerrar</button>' +
        '<a class="cat-wa" href="' + esc(link) + '" target="_blank" rel="noopener" data-copia-abrir>' + ICONO.ig + '<span>Abrir Instagram</span></a></div>' +
        '</div>';
      function cerrar() {
        document.removeEventListener('keydown', teclas, true);
        if (fondo.parentNode) fondo.parentNode.removeChild(fondo);
        if (previo && typeof previo.focus === 'function') previo.focus();
      }
      function teclas(e) { if (e.key === 'Escape') { e.preventDefault(); cerrar(); } }
      fondo.addEventListener('click', function (e) {
        if (e.target === fondo || e.target.closest('[data-copia-cerrar]') || e.target.closest('[data-copia-abrir]')) cerrar();
